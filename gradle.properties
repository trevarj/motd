org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
# Keep the daemon warm and parallelize the module/variant graph. Hosted CI may
# use four workers; Nix development shells cap local builds at two to avoid OOM.
org.gradle.parallel=true
org.gradle.workers.max=4
android.useAndroidX=true
# Nix must override AGP's dynamically linked aapt2 with the SDK-provided binary.
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE
# Preserve debug and release unit-test components under AGP 9.
android.onlyEnableUnitTestForTheTestedBuildType=false
kotlin.code.style=official
# Deterministic source-build defaults. Release and F-Droid metadata override these per build.
motdVersionName=0.17.3
motdVersionCode=17003
