name: Required CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runtime: ${{ steps.classify.outputs.runtime }}
      irc: ${{ steps.classify.outputs.irc }}
      app: ${{ steps.classify.outputs.app }}
      device: ${{ steps.classify.outputs.device }}
      package: ${{ steps.classify.outputs.package }}
      harness: ${{ steps.classify.outputs.harness }}
      debug_lint: ${{ steps.classify.outputs.debug_lint }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - name: Classify changed paths
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]] && git cat-file -e "$BASE_SHA^{commit}"; then
            git diff --check "$BASE_SHA" "$GITHUB_SHA"
            mapfile -t paths < <(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")
            ./tools/ci-paths.sh "${paths[@]}" >> "$GITHUB_OUTPUT"
          else
            ./tools/ci-paths.sh unknown/runtime.surface >> "$GITHUB_OUTPUT"
          fi
      - name: Validate workflow and E2E harness changes
        if: steps.classify.outputs.harness == 'true'
        run: ./test/e2e/validate.sh

  irc:
    needs: changes
    if: needs.changes.outputs.irc == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MOTD_FUZZ_PROFILE: pr
      MOTD_FUZZ_SEED: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with: { cache-read-only: true }
      - uses: ./.github/actions/setup-native-toolchain
      - name: IRC format and unit tests
        run: ./gradlew :irc:ktlintCheck :irc:test --stacktrace
      - name: Upload IRC generated-test failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: irc-fuzz-failure-${{ github.run_id }}
          path: |
            irc/build/fuzz-failures/**
            irc/build/reports/tests/test/**
          if-no-files-found: ignore
          retention-days: 14

  app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      MOTD_FUZZ_PROFILE: pr
      MOTD_FUZZ_SEED: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { submodules: recursive }
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with: { distribution: temurin, java-version: 21 }
      # This is the sole writable Gradle cache producer. Parallel and scheduled jobs read it.
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - uses: ./.github/actions/setup-native-toolchain
      - name: Kotlin formatting
        run: ./gradlew ktlintCheck --stacktrace
      - name: App unit and Robolectric component tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Upload app test failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-test-failure-${{ github.run_id }}
          path: |
            app/build/fuzz-failures/**
            app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: ignore
          retention-days: 14
      - name: Verify checked-in Room schemas
        run: |
          git diff --exit-code -- app/schemas
          test -z "$(git ls-files --others --exclude-standard -- app/schemas)"

  android:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { submodules: recursive }
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with: { cache-read-only: true }
      - uses: ./.github/actions/setup-native-toolchain
      - name: Verify FOSS dependency boundary
        run: |
          if ./gradlew :app:dependencies --configuration releaseRuntimeClasspath \
            | grep -Ei 'firebase|play-services'; then
            echo "Google-only dependencies reached the FOSS runtime classpath" >&2
            exit 1
          fi
      - name: Android lint (warnings as errors)
        id: lint
        env:
          MOTD_LINT_DEBUG: ${{ needs.changes.outputs.debug_lint }}
          MOTD_LINT_LOG: app/build/reports/android-lint.log
        run: ./tools/android-lint.sh
      - name: Upload lint diagnostics
        if: steps.lint.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-lint-failure-${{ github.run_id }}
          path: |
            app/build/reports/android-lint.log
            app/build/reports/lint-results-*.txt
            app/build/reports/lint-results-*.sarif
            app/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 14
      - name: Assemble release APK and verify AI native artifacts
        if: needs.changes.outputs.package == 'true'
        run: ./gradlew :app:assembleRelease :app:verifyAiNativeArtifacts --stacktrace

  headless:
    needs: changes
    if: needs.changes.outputs.device == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { submodules: recursive }
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with: { cache-read-only: true }
      - uses: ./.github/actions/setup-native-toolchain
      - name: Assemble required journey APKs
        run: ./gradlew :app:assembleE2e :app:assembleE2eAndroidTest --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Resolve emulator revision for the AVD cache key
        id: emulator-revision
        run: |
          set -uo pipefail
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Android/Sdk}}"
          revision=""
          if [ -x "$sdk/emulator/emulator" ]; then
            revision="$(timeout 60 "$sdk/emulator/emulator" -version 2>/dev/null \
              | sed -n 's/.*emulator version \([0-9][0-9A-Za-z.]*\).*/\1/p' \
              | head -n 1)" || revision=""
          fi
          if [ -z "$revision" ] && [ -x "$sdk/cmdline-tools/latest/bin/sdkmanager" ]; then
            revision="$(timeout 300 "$sdk/cmdline-tools/latest/bin/sdkmanager" \
              --list_installed 2>/dev/null \
              | awk -F'|' '$1 ~ /^[[:space:]]*emulator[[:space:]]*$/ {
                  gsub(/[[:space:]]/, "", $2); print $2; exit }')" || revision=""
          fi
          if [ -z "$revision" ] && [ -n "${ImageVersion:-}" ]; then
            revision="image-${ImageVersion}"
          fi
          if [ -z "$revision" ]; then
            revision="unresolved-${GITHUB_RUN_ID:-$(date +%s)}"
          fi
          revision="$(printf '%s' "$revision" | tr -c 'A-Za-z0-9._-' '-')"
          echo "Emulator revision for AVD cache key: $revision"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - name: AVD cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: avd-cache
        with:
          path: ~/.android/avd/*
          key: avd-api34-default-x86_64-pixel6-emu-${{ steps.emulator-revision.outputs.revision }}
      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          disable-animations: false
          emulator-options: -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: echo "Generated AVD snapshot for caching."
      - name: Start hermetic bouncer stack
        run: ./test/e2e/hermetic-stack.sh up
      - name: Run required isolated journeys
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-window -no-snapshot-save -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: ./test/e2e/fast-suite.sh connected
      - name: Upload privacy-safe required diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: headless-diagnostics
          path: test/e2e/artifacts/fast-suite/**
          if-no-files-found: ignore
          retention-days: 14
      - name: Tear down hermetic stack
        if: always()
        run: ./test/e2e/hermetic-stack.sh down || true

  gate:
    if: always()
    needs: [changes, irc, app, android, headless]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every applicable CI tier
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          IRC_REQUIRED: ${{ needs.changes.outputs.irc }}
          APP_REQUIRED: ${{ needs.changes.outputs.app }}
          DEVICE_REQUIRED: ${{ needs.changes.outputs.device }}
          IRC_RESULT: ${{ needs.irc.result }}
          APP_RESULT: ${{ needs.app.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
          HEADLESS_RESULT: ${{ needs.headless.result }}
        run: |
          set -euo pipefail
          test "$CHANGES_RESULT" = success
          require_result() {
            if [ "$1" = true ]; then
              test "$2" = success
            else
              test "$2" = skipped
            fi
          }
          require_result "$IRC_REQUIRED" "$IRC_RESULT"
          require_result "$APP_REQUIRED" "$APP_RESULT"
          require_result "$APP_REQUIRED" "$ANDROID_RESULT"
          require_result "$DEVICE_REQUIRED" "$HEADLESS_RESULT"
