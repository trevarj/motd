name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  checks: read

jobs:
  verify-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require latest Required CI gate for tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          conclusion="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100" \
            --jq '[.check_runs[] | select(.name == "gate" and .app.slug == "github-actions")] | sort_by(.started_at) | last | .conclusion // ""')"
          test "$conclusion" = success || {
            echo "Latest Required CI / gate for $GITHUB_SHA is '${conclusion:-missing}', not success" >&2
            exit 1
          }

  release:
    needs: verify-ci
    permissions:
      contents: write
      checks: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with: { cache-read-only: true }
      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          version_name="$(sed -n 's/^motdVersionName=//p' gradle.properties)"
          version_code="$(sed -n 's/^motdVersionCode=//p' gradle.properties)"
          [[ "$GITHUB_REF_NAME" == "v$version_name" ]] || {
            echo "tag $GITHUB_REF_NAME does not match gradle.properties version $version_name" >&2
            exit 1
          }
          [[ "$version_code" =~ ^[0-9]+$ ]] || {
            echo "invalid motdVersionCode: $version_code" >&2
            exit 1
          }
          printf 'MOTD_VERSION_NAME=%s\nMOTD_VERSION_CODE=%s\nMOTD_SOURCE_COMMIT=%s\n' \
            "$version_name" "$version_code" "$GITHUB_SHA" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-native-toolchain
      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/keystore.jks"
      - name: Build signed release APK and verify AI native artifacts
        env:
          MOTD_KEYSTORE_PATH: ${{ runner.temp }}/keystore.jks
          MOTD_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          MOTD_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MOTD_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:verifyAiNativeArtifacts --stacktrace
      - name: Verify F-Droid-compatible APK signing blocks
        run: >-
          java .github/scripts/CheckApkSigningBlocks.java
          app/build/outputs/apk/release/app-release.apk
      - name: Prepare licensed release assets
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          ./third_party/sing-box/prepare-release-assets.sh \
            "${{ github.ref_name }}" \
            app/build/outputs/apk/release/app-release.apk \
            release-assets
          ./third_party/ai/prepare-release-assets.sh \
            "${{ github.ref_name }}" \
            release-assets
      - name: Prepare release notes
        shell: bash
        run: |
          set -euo pipefail
          changelog="fastlane/metadata/android/en-US/changelogs/${MOTD_VERSION_CODE}.txt"
          [[ -s "$changelog" ]] || {
            echo "missing F-Droid changelog: $changelog" >&2
            exit 1
          }
          {
            printf "## What's new\n\n"
            cat "$changelog"
            printf '\n\n'
            cat release-assets/release-compliance.md
          } > release-assets/release-notes.md
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          body_path: release-assets/release-notes.md
          fail_on_unmatched_files: true
          files: |
            release-assets/motd-${{ github.ref_name }}-foss.apk
            release-assets/motd-libbox-source-${{ github.ref_name }}.tar.gz
            release-assets/motd-ai-source-${{ github.ref_name }}.tar.gz
            release-assets/LICENSE
            release-assets/ROBOTO-LICENSE.txt
            release-assets/SHA256SUMS
            release-assets/motd-${{ github.ref_name }}-THIRD_PARTY_NOTICES.md
          generate_release_notes: true
